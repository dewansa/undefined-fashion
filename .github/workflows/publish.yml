# Runs after the teacher merges a pull request into main.
# 1. "find": which submission folders changed.
# 2. "score": trains them and measures them, then trains them once more to count their
#    compute (FLOPs). It runs student code, so it only gets read access. Skipped when
#    no submission changed.
# 3. "publish": saves the results to the repo as reviewed rows, removes the
#    "not reviewed" rows of merged or closed pull requests, and updates the website.
name: Score and publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      submission:
        description: "Folder name in submissions/ to score again, or 'all'. Leave empty to only rebuild the website."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      names: ${{ steps.find.outputs.names }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: find
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          CHOSEN: ${{ inputs.submission }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$CHOSEN" = "all" ]; then
              names=$(.github/scripts/changed-submissions.sh all)
            else
              names=$(.github/scripts/changed-submissions.sh all | grep -Fx "$CHOSEN" || true)
            fi
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            names=$(.github/scripts/changed-submissions.sh all)  # first push: score everything
          else
            names=$(.github/scripts/changed-submissions.sh "$BEFORE..HEAD")
          fi
          names=$(echo $names)  # one line, separated by spaces (empty stays empty)
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "Submissions to score: ${names:-none}"

  score:
    needs: find
    if: needs.find.outputs.names != ''
    runs-on: ubuntu-latest
    # --flops trains each submission a second time inside the FLOP counter (up to 30
    # minutes more for each one), so this job gets more time than the pull request check.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync

      # Download the images before any student code runs, and cache them for next time.
      - id: data-cache
        uses: actions/cache/restore@v6
        with:
          path: data
          key: fashion-mnist-v1
      - name: Download Fashion-MNIST
        run: uv run python -c "from fashion import data; data.train_set(); data.test_set()"
      - if: steps.data-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: data
          key: fashion-mnist-v1

      - name: Score submissions
        env:
          NAMES: ${{ needs.find.outputs.names }}
        run: |
          folders=()
          for name in $NAMES; do folders+=("submissions/$name"); done
          uv run score "${folders[@]}" --flops --save new-results
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: new-results
          path: new-results/
          if-no-files-found: ignore

  publish:
    needs: [find, score]
    # Publish the results that worked, even if one submission failed or none changed.
    if: ${{ !cancelled() && needs.find.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only one job writes results at a time. "queue: max" keeps every waiting run
    # in line, so a merge's results are never dropped.
    concurrency:
      group: leaderboard
      queue: max
    permissions:
      contents: write
      pages: write
      id-token: write
      pull-requests: read # to find which pull requests are still open
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/download-artifact@v8
        if: needs.score.result != 'skipped'
        continue-on-error: true # nothing to download when every submission failed
        with:
          name: new-results
          path: results/

      - name: Save new results to the repo
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # A merged pull request now has a reviewed row, so remove its "not reviewed" row.
          open=$(gh api "repos/$REPO/pulls?state=open&per_page=100" --paginate --jq '.[].number' | tr '\n' ' ')
          uv run --no-project --python 3.14 python src/fashion/leaderboard.py clean --open "$open"
          .github/scripts/commit-results.sh "Add leaderboard results"

      - name: Build the website
        run: |
          mkdir -p _site
          cp site/index.html _site/
          uv run --no-project --python 3.14 python src/fashion/leaderboard.py build --out _site/results.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
